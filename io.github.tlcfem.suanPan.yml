app-id: io.github.tlcfem.suanPan
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: suanPan
finish-args:
  - '--filesystem=home'
  - '--socket=fallback-x11'
  - '--device=dri'
  - '--socket=wayland'
  - '--share=ipc'
cleanup:
  - /vtk
  - /oneapi
modules:
  - name: suanPan
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - '-DCMAKE_BUILD_TYPE=Release'
      - '-DMKL_PATH=/app/oneapi/mkl/latest'
      - '-DSP_BUILD_PARALLEL=ON'
      - '-DSP_ENABLE_AVX2=OFF'
      - '-DSP_ENABLE_HDF5=ON'
      - '-DSP_ENABLE_IOMP=OFF'
      - '-DSP_ENABLE_MKL=ON'
      - '-DSP_ENABLE_SHARED_MKL=OFF'
      - '-DSP_ENABLE_VTK=ON'
      - '-DSUANPAN_DATE="Oct 10 2026"'
      - '-DVTK_PATH=/app/vtk/lib/cmake/vtk-9.7/'
    post-install:
      - install -Dm644 ../Resource/suanPan-ua.svg /app/share/icons/hicolor/scalable/apps/io.github.tlcfem.suanPan.svg
      - install -Dm644 ../io.github.tlcfem.suanPan.metainfo.xml /app/share/metainfo/io.github.tlcfem.suanPan.metainfo.xml
      - install -Dm644 ../io.github.tlcfem.suanPan.desktop /app/share/applications/io.github.tlcfem.suanPan.desktop
    sources:
      - type: git
        url: https://github.com/TLCFEM/suanPan.git
        commit: 97da75b0163584eefa4923c1cded1863893e916f
      - type: file
        path: io.github.tlcfem.suanPan.metainfo.xml
      - type: file
        path: io.github.tlcfem.suanPan.desktop
    modules:
      - name: vtk
        buildsystem: cmake-ninja
        builddir: true
        config-opts:
          - '-DCMAKE_BUILD_TYPE=Release'
          - '-DBUILD_SHARED_LIBS=OFF'
          - '-DCMAKE_INSTALL_PREFIX=/app/vtk'
          - '-DCMAKE_CXX_FLAGS=-Wno-stringop-overflow -Wno-stringop-overread'
        sources:
          - type: archive
            url: https://vtk.org/files/release/9.7/VTK-9.7.1.tar.gz
            sha256: cae04fd355004cb916a409db79d53a208f1221e975aeacc7540ee67b148ee91a
      - name: mkl
        only-arches:
          - x86_64
        buildsystem: simple
        build-commands:
          - sh ./intel-onemkl-2026.1.0.237_offline.sh -a --silent --eula accept --install-dir /app/oneapi
        sources:
          - type: file
            url: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/17f37e16-768e-40d2-bcf8-c252dc6c5499/intel-onemkl-2026.1.0.237_offline.sh
            sha256: 854deea4c4eec21d23cfb895b0c76ac02b5a76e3a9581a39b4c69fb7ffc69146
